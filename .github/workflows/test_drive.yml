name: Process Camera Videos

on:
  workflow_dispatch:

  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

concurrency:
  group: reolink-video-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Create credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Process videos
        env:
          REOLINK_DRIVE_ROOT_ID: ${{ secrets.REOLINK_DRIVE_ROOT_ID }}
          REOLINK_APPS_SCRIPT_URL: ${{ secrets.REOLINK_APPS_SCRIPT_URL }}
          REOLINK_WEBAPP_TOKEN: ${{ secrets.REOLINK_WEBAPP_TOKEN }}
        run: |
          python process_videos.py
